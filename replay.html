<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다중 UAV 항법 리플레이 · 김도윤</title>
<style>
  :root{color-scheme:dark;--bg:#0d1422;--panel:#151f30;--line:#303e54;--ink:#eff4ff;--muted:#b3bfd2;--accent:#a9c5ff;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,"Malgun Gothic",sans-serif;}
  main{max-width:1180px;margin:auto;padding:clamp(20px,5vw,70px) clamp(16px,5vw,56px);}
  a{color:var(--accent);text-underline-offset:4px;}
  .home{font-size:14px;}
  header{margin:28px 0;}
  .label{color:var(--accent);font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.16em;}
  h1{font-size:clamp(31px,5.6vw,66px);letter-spacing:-.055em;line-height:1.12;margin:12px 0;word-break:keep-all;}
  p{margin:0;color:var(--muted);word-break:keep-all;}
  .player{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;}
  .toolbar,.transport,.chapters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;}
  .toolbar{justify-content:space-between;}
  .toolbar strong{font-size:14px;}
  .modes{display:flex;gap:5px;flex-wrap:wrap;}
  button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:#202c40;padding:7px 12px;min-height:40px;}
  button:hover{background:#30415d;}
  button[aria-pressed="true"],#play{background:#a9c5ff;color:#102040;border-color:#a9c5ff;}
  :focus-visible{outline:2px solid #82e7e3;outline-offset:3px;}
  .screen{overflow:hidden;background:white;}
  video{display:block;width:100%;height:auto;max-width:none;}
  .screen:not([data-view="both"]){max-width:650px;margin-inline:auto;}
  .screen[data-view="apf"] video,.screen[data-view="kmpl"] video{width:200%;}
  .screen[data-view="kmpl"] video{transform:translateX(-50%);}
  .transport{border-top:1px solid var(--line);}
  .transport input{min-width:70px;flex:1;accent-color:var(--accent);cursor:pointer;}
  output{font:600 13px/1.2 ui-monospace,monospace;white-space:nowrap;color:var(--muted);}
  .chapters{padding-top:0;}
  .chapters span{color:var(--muted);font-size:13px;margin-right:4px;}
  .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:15px;font-size:13px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<main>
  <a class="home" href="index.html#research">← 대표 연구로</a>
  <header>
    <div class="label">RESEARCH REPLAY / 01</div>
    <h1>밀집 장애물 속 다중 UAV 항법</h1>
    <p>같은 시점에서 Reactive APF와 KMPL의 움직임을 비교해 보세요.</p>
  </header>
  <section class="player" aria-label="시뮬레이션 리플레이">
    <div class="toolbar" id="toolbar" hidden>
      <strong>보기 모드</strong>
      <div class="modes" role="group" aria-label="알고리즘 비교 모드">
        <button type="button" data-mode="both" aria-pressed="true">나란히 비교</button>
        <button type="button" data-mode="apf" aria-pressed="false">Reactive APF 확대</button>
        <button type="button" data-mode="kmpl" aria-pressed="false">KMPL 확대</button>
      </div>
    </div>
    <div class="screen" id="screen" data-view="both">
      <video id="replay" src="assets/research/kmpl-replay.mp4" preload="metadata" playsinline controls aria-label="Reactive APF와 KMPL의 동일 시점 비교 영상"></video>
    </div>
    <div class="transport" id="transport" hidden>
      <button id="play" type="button">재생</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
      <output id="time" for="seek">0.0초</output>
    </div>
    <div class="chapters" id="chapters" hidden>
      <span>장면 이동</span>
      <button type="button" data-position="0">처음</button>
      <button type="button" data-position="0.5">중간</button>
      <button type="button" data-position="1">끝</button>
    </div>
  </section>
  <div class="foot">
    <p>공개 포트폴리오의 시뮬레이션 1건을 재생합니다.</p>
    <a href="assets/research/kmpl.gif">원본 GIF 열기 ↗</a>
  </div>
</main>
<script>
  const video = document.getElementById('replay');
  const play = document.getElementById('play');
  const seek = document.getElementById('seek');
  const time = document.getElementById('time');
  const modes = document.querySelectorAll('[data-mode]');

  function updatePosition() {
    if (!Number.isFinite(video.duration) || !video.duration) return;
    seek.value = Math.round(video.currentTime / video.duration * 1000);
    time.value = video.currentTime.toFixed(1) + ' / ' + video.duration.toFixed(1) + '초';
    seek.setAttribute('aria-valuetext', time.value);
  }

  function goTo(fraction) {
    if (Number.isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(video.duration - 0.025, fraction * video.duration));
  }

  function syncPlayButton() {
    play.textContent = video.paused || video.ended ? '재생' : '일시정지';
  }

  for (const button of modes) {
    button.addEventListener('click', () => {
      document.getElementById('screen').dataset.view = button.dataset.mode;
      for (const mode of modes) mode.setAttribute('aria-pressed', String(mode === button));
    });
  }
  play.addEventListener('click', async () => {
    if (!video.paused && !video.ended) {
      video.pause();
      return;
    }
    if (video.currentTime >= video.duration - 0.05) goTo(0);
    try { await video.play(); } catch { video.controls = true; }
  });
  seek.addEventListener('input', () => goTo(Number(seek.value) / 1000));
  for (const button of document.querySelectorAll('[data-position]')) {
    button.addEventListener('click', () => {
      video.pause();
      goTo(Number(button.dataset.position));
    });
  }
  for (const event of ['timeupdate', 'loadedmetadata', 'seeked']) video.addEventListener(event, updatePosition);
  for (const event of ['play', 'pause', 'ended']) video.addEventListener(event, syncPlayButton);

  function enableControls() {
    updatePosition();
    for (const id of ['toolbar', 'transport', 'chapters']) document.getElementById(id).hidden = false;
    video.controls = false;
  }
  if (video.readyState >= 1) enableControls();
  else video.addEventListener('loadedmetadata', enableControls, { once: true });
</script>
</body>
</html>
